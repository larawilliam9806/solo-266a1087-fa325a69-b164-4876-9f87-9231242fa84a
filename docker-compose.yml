services:
  api:
    build: .
    image: parcel-well-api
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/app.db
    volumes:
      - parcel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  parcel-data:
